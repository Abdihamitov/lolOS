<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>lolOS</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop">
        <header class="topbar">
            <div class="topbar-left">
                <span class="logo">lolOS</span>
            </div>
            <div class="topbar-right">
                <span id="clock">00:00</span>
            </div>
        </header>

        <main class="desktop-icons">

            <div class="desktop-icon">
                <div class="icon-box">
                    💻
                </div>
                <span>Terminal</span>
            </div>

            <div class="desktop-icon">
                <div class="icon-box">
                    📝
                </div>
                <span>Notes</span>
            </div>

            <div class="desktop-icon">
                <div class="icon-box">
                    👤
                </div>
                <span>About</span>
            </div>

        </main>

        <footer class="dock">

            <div class="dock-icon">
                💻

            </div>

            <div class="dock-icon">
                📝
            </div>

        </footer>


    </div>
    <script src="script.js"></script>
    
</body>
</html>
