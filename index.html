<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>lolOS</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop">
        <header class="topbar">
            <div class="topbar-left">
                <span class="logo">lolOS</span>
            </div>
            <div class="topbar-right">
                <span id="clock">00:00</span>
            </div>
        </header>

        <main class="desktop-icons">

            <div class="desktop-icon">
                <div class="icon-box">
                    💻
                </div>
                <span>Terminal</span>
            </div>

            <div class="desktop-icon">
                <div class="icon-box">
                    📝
                </div>
                <span>Notes</span>
            </div>

            <div class="desktop-icon">
                <div class="icon-box">
                    👤
                </div>
                <span>About</span>
            </div>

        </main>

        <div class="window" id="terminalWindow">
            <div class="window-header">
                <span>Terminal</span>
                <button class="close-button" data-close="terminalWindow">
                    ×
                </button>
            </div>

            <div class="window-content terminal-content">
                <p>
                    adel@lolOS:~$
                    <span class="terminal-cursor">_</span>
                </p>

            </div>

        </div>
    
    <div class="window" id="notesWindow">

        <div class="window-header">

            <span>Notes</span>

            <button class="close-button" data-close="notesWindow">
                ×
            </button>

        </div>

        <div class="window-content">

            <h2>lolNotes</h2>

            <textarea
                class="notes-area"
                placeholder="Write something..."
            ></textarea>

        </div>

    </div>

    <div class="window" id="aboutWindow">

        <div class="window-header">

            <span>About</span>

            <button class="close-button" data-close="aboutWindow">
                ×
            </button>

        </div>

        <div class="window-content">

            <h2>lolOS</h2>

            <p>
                A browser operating system created by Adel.
            </p>

            <p>
                Built with HTML, CSS and JavaScript.
            </p>

        </div>

    </div>

        <footer class="dock">

            <div class="dock-icon">
                💻

            </div>

            <div class="dock-icon">
                📝
            </div>

        </footer>


    </div>
    <script src="script.js"></script>
    
</body>
</html>
